<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Irawo Hub | Boots and field gear</title>
<meta name="description" content="Combat boots and field gear. Pick your size and order on WhatsApp.">
<meta property="og:title" content="Irawo Hub | Boots and field gear">
<meta property="og:description" content="Pick your size and order on WhatsApp.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23141711'/%3E%3Cpath d='M50 12l11 26 28 3-21 19 6 28-24-14-24 14 6-28-21-19 28-3z' fill='%23d4ac2b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141711;--card:#232919;--line:#3a4129;--text:#eef0e4;--muted:#a9ae98;--gold:#d4ac2b;
--display:'Barlow Condensed','Arial Narrow',Impact,sans-serif;--body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font:17px/1.6 var(--body);overflow-x:hidden}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.wrap{width:min(1080px,100% - 32px);margin-inline:auto}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;line-height:.95}
header{border-bottom:1px solid var(--line)}
.nav{display:flex;justify-content:space-between;align-items:center;height:62px}
.logo{font:800 1.6rem var(--display);text-transform:uppercase;letter-spacing:.05em;display:flex;gap:8px;align-items:center}
.logo svg{width:22px;height:22px;fill:var(--gold)}
.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 26px;background:var(--gold);color:#1a1604;font:700 1.05rem var(--display);text-transform:uppercase;letter-spacing:.06em;text-decoration:none;border:0;cursor:pointer}
.btn.sm{padding:10px 18px;font-size:.95rem}
.hero{padding:72px 0 60px;background:radial-gradient(circle at 90% 10%,#5d6b3244,transparent 55%)}
.eyebrow{font:700 .9rem var(--display);letter-spacing:.18em;text-transform:uppercase;color:var(--gold);border-left:3px solid var(--gold);padding-left:12px;display:inline-block;margin-bottom:18px}
.hero h1{font-size:clamp(3.4rem,11vw,7rem);font-weight:800;margin-bottom:18px}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);font-size:1.1rem;max-width:44ch;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;padding-bottom:70px}
.item{background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column}
.item img{width:100%;aspect-ratio:1/1;object-fit:cover;border-bottom:1px solid var(--line);background:#171a11}
.b{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.b h3{font-size:1.6rem}
.price{font:800 1.6rem var(--display);color:var(--gold)}
label{font:700 .8rem var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
select{width:100%;padding:11px 12px;background:#141711;color:var(--text);border:1px solid var(--line);font:500 1rem var(--body)}
.err{color:#ff9a8a;font-size:.88rem;min-height:1.3em}
footer{border-top:1px solid var(--line);padding:26px 0 90px;color:var(--muted);font-size:.9rem;text-align:center}
.float{position:fixed;right:14px;bottom:14px;background:#25d366;color:#06310f;font:700 1rem var(--body);padding:13px 18px;border-radius:999px;text-decoration:none;box-shadow:0 8px 24px #0009}
@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.nav .btn{display:none}}
</style>
</head>
<body>
<header><div class="wrap nav">
  <div class="logo"><svg viewBox="0 0 100 100"><path d="M50 8l12 28 30 3-23 20 7 30-26-16-26 16 7-30-23-20 30-3z"/></svg>Irawo Hub</div>
  <a class="btn sm" data-wa="Hi Irawo Hub, I'd like to place an order." href="#">Order on WhatsApp</a>
</div></header>

<main>
<section class="hero"><div class="wrap">
  <span class="eyebrow">Boots and field gear</span>
  <h1>Gear up. <em>Stand ready.</em></h1>
  <p>Pick your item, choose your size, and send your order on WhatsApp.</p>
  <a class="btn" href="#shop">See the gear</a>
</div></section>

<section id="shop"><div class="wrap"><div class="grid" id="products"></div></div></section>
</main>

<footer><div class="wrap">© <span id="yr">2026</span> Irawo Hub. Demo page.</div></footer>
<a class="float" data-wa="Hi Irawo Hub, I have a question." href="#" aria-label="Chat on WhatsApp">💬 WhatsApp</a>

<script>
/* ===== EDIT HERE =====
   WHATSAPP: number with country code, no + or spaces.
   PRODUCTS: the prices below are SAMPLE prices. Replace them with the real ones.
   sizes: the sizes you want shown in each dropdown. */
const WHATSAPP = "2347065571852";
const BOOT_SIZES = ["EU 40","EU 41","EU 42","EU 43","EU 44","EU 45","EU 46"];
const PRODUCTS = [
  {name:"Black Leather Combat Boots", price:"₦45,000", image:"images/boot-black-leather.jpg", sizes:BOOT_SIZES},
  {name:"Black Parade Boots",         price:"₦40,000", image:"images/boot-black-parade.jpg",  sizes:BOOT_SIZES},
  {name:"Olive Jungle Boots",         price:"₦50,000", image:"images/boot-olive-jungle.jpg",  sizes:BOOT_SIZES},
  {name:"Tropical Combat Boots",      price:"₦55,000", image:"images/boot-tropical-tag.jpg",  sizes:BOOT_SIZES},
  {name:"Black Tactical Boots",       price:"₦48,000", image:"images/boot-black-tactical.jpg",sizes:BOOT_SIZES},
  {name:"Field Knife Set",            price:"₦30,000", image:"images/field-knives.jpg",       sizes:["Small","Medium","Large"]}
];
const wa=t=>`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(t)}`;
document.querySelectorAll('[data-wa]').forEach(a=>{a.href=wa(a.dataset.wa);a.target="_blank";a.rel="noopener"});
const box=document.getElementById('products');
PRODUCTS.forEach((p,i)=>{
  const d=document.createElement('article');d.className='item';
  d.innerHTML=`<img src="${p.image}" alt="${p.name}" loading="lazy">
  <div class="b"><h3>${p.name}</h3><div class="price">${p.price}</div>
  <label for="s${i}">Size</label>
  <select id="s${i}"><option value="">Select size</option>${p.sizes.map(s=>`<option>${s}</option>`).join('')}</select>
  <div class="err" aria-live="polite"></div>
  <button class="btn">Order on WhatsApp</button></div>`;
  d.querySelector('button').onclick=()=>{
    const s=d.querySelector('select').value,e=d.querySelector('.err');
    if(!s){e.textContent="Please choose a size first.";return}
    e.textContent="";
    window.open(wa(`Hi Irawo Hub, I'd like to order:\n${p.name}\nSize: ${s}\nPrice: ${p.price}\nIs it available?`),'_blank','noopener');
  };
  box.appendChild(d);
});
document.getElementById('yr').textContent=new Date().getFullYear();
</script>
</body>
</html>
